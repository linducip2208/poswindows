name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test (Release)
        run: dotnet test tests/KasirPro.Tests -c Release --no-build --verbosity normal

      - name: Publish self-contained win-x64
        run: dotnet publish src/KasirPro.App -c Release -r win-x64 --self-contained true -o dist/KasirPro

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirPro-win-x64
          path: dist/KasirPro
